services:
  db:
    build: ./postgres
    container_name: postgres-db
    env_file:
      - ./postgres/conf/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-42-api:
    build: ./backend
    container_name: django-auth-42-api
    command: sh -c "
      python manage.py makemigrations api &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000"
    env_file:
      - backend/.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  auth-db-api: # auth-local 
    build: ./backend2
    container_name: django-auth-db-api
    command: sh -c "
      python manage.py makemigrations api &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8001"
    env_file:
      - backend2/.env
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    build: ./frontend
    container_name: apache-web
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - auth-42-api
      - auth-db-api
    networks:
      - app_network

volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
