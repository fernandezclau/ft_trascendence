<div class="login-container">
    <div class="login-box">
        <h2 class="text-center">Welcome back</h2>
        <p class="text-center text-muted">Welcome back! Please enter your details.</p>

        <form>
            <div class="mb-3 login-elem">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="Enter your email" required>
            </div>
            <div class="mb-2 login-elem input">
                <label for="password" class="form-label">Password</label>
                <div class="input-container">
                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                    <i class="fas fa-eye" id="togglePassword" onclick="togglePassword('password', 'togglePassword')"></i>
                </div>
            </div>

            <div class="login-elem">
                <a href="#" class="forgot-password">Forgot password</a>
            </div>

            <button type="submit" class="btn btn-dark w-100">Login</button>

            <button class="btn btn-light w-100 mt-3 btn-hover">
                <img src="images/42_icon.png" alt="42 Logo" width="25">
                Sign in with 42
            </button>
        </form>

        <p class="text-center mt-3">Don't have an account? <a href="#/register" class="sign-up">Sign up</a></p>
    </div>
</div>
