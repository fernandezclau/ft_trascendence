<div class="tournament-container">
    <h1>Create Pong Tournament</h1>
    <form id="createTournamentForm">
        <!-- Tournament Options -->
        <div class="form-group">
            <label for="numParticipants">Number of Participants</label>
            <select id="numParticipants" name="numParticipants">
                <option value="4">4 Players</option>
                <option value="8">8 Players</option>
                <option value="16">16 Players</option>
                <option value="32">32 Players</option>
            </select>
        </div>

        <div class="form-group">
            <label for="rounds">Number of Rounds (Best of)</label>
            <select id="rounds" name="rounds">
                <option value="3">Best of 3</option>
                <option value="5">Best of 5</option>
                <option value="7">Best of 7</option>
            </select>
        </div>

        <div class="form-group toggle-options">
            <label for="matchmaking">Enable Matchmaking</label>
            <input type="checkbox" id="matchmaking" name="matchmaking">
        </div>
         <!-- Team Setup Table (Visible if Matchmaking is Off) -->
        <div id="teamTable" style="">
            <h3>Manage Players by Team</h3>
            <table class="team-table" id="teamsTable">
                <thead>
                    <tr>
                        <th>Team 1</th>
                        <th>Team 2</th>
                        <th>Team 3</th>
                        <th>Team 4</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><div class="player" draggable="true" ondragstart="drag(event)">Player 1</div></td>
                        <td><div class="player" draggable="true" ondragstart="drag(event)">Player 2</div></td>
                        <td><div class="player" draggable="true" ondragstart="drag(event)">Player 3</div></td>
                        <td><div class="player" draggable="true" ondragstart="drag(event)">Player 4</div></td>
                    </tr>
                    <tr>
                        <td><div class="player" draggable="true" ondragstart="drag(event)">Player 5</div></td>
                        <td><div class="player" draggable="true" ondragstart="drag(event)">Player 6</div></td>
                        <td><div class="player" draggable="true" ondragstart="drag(event)">Player 7</div></td>
                        <td><div class="player" draggable="true" ondragstart="drag(event)">Player 8</div></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Team Setup -->
        <div id="teamSetup" class="form-group">
            <label for="teamSize">Team Size (if not matchmaking)</label>
            <select id="teamSize" name="teamSize">
                <option value="1">1 Player per Team</option>
                <option value="2">2 Players per Team</option>
                <option value="3">3 Players per Team</option>
            </select>
        </div>

        <!-- Tournament Type -->
        <div class="form-group">
            <label for="tournamentType">Tournament Type</label>
            <select id="tournamentType" name="tournamentType">
                <option value="elimination">Elimination</option>
                <option value="roundRobin">Round Robin</option>
                <option value="mixed">Mixed</option>
            </select>
        </div>

        <!-- Submit Button -->
        <button type="button" class="btn" onclick="createTournament()">Create Tournament</button>
    </form>
</div>
