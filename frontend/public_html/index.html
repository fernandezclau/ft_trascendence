<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Title -->
        <title>PONG | · |</title>
        
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="images/favicon.ico">

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

        <!-- CSS Styles -->
        <link rel="stylesheet" href="style/index.css">
        <link rel="stylesheet" href="style/pong.css">
    </head>
    
    <body>

        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="#" onclick="loadPage('home')">PONG</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" onclick="loadPage('tournament')">Tournament</a></li>
                        <li class="nav-item"><a class="nav-link" onclick="loadPage('dashboard')">Dashboard</a></li>
                        <li class="nav-item"><a class="nav-link" onclick="loadPage('info')">Info</a></li>
                        <li class="nav-item"><a class="nav-link" onclick="loadPage('login')">Login</a></li>
                        <li class="nav-item">
                            <a class="nav-link" onclick="loadPage('settings')">
                                <img src="images/w_config_icon.png" alt="Configuración" class="config-icon">
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Dynamic content -->
        <div class="content-container" id="content-container">
        </div>
        
        
        <div id="playerSelection" class="selection">
            <div class="selection-element">
                <h4>Number of players</h4>
                <div>
                    <button class="player-btn players-btn-group selected" onclick="selectPlayers(1)">1</button>
                    <button class="player-btn players-btn-group" onclick="selectPlayers(2)">2</button>
                    <button class="player-btn players-btn-group" onclick="selectPlayers(4)">4</button>
                </div>
            </div>
        
            <div class="selection-element">
                <h4>Points to win</h4>
                <div>
                    <button class="player-btn points-btn-group" onclick="selectPoints(5)">5</button>
                    <button class="player-btn points-btn-group selected" onclick="selectPoints(10)">10</button>
                    <button class="player-btn points-btn-group" onclick="selectPoints(15)">15</button>
                </div>
            </div>
        </div>
        
        <div id="startScreen">
            <div id="playerRegistrationContainer">
                <button id="startButton">Start</button>
            </div>
        </div>

        <!-- Game -->
        <div id="game">
            <div id="score">
                <h1 id="player1Score">0</h1>
                <h1 id="player2Score">0</h1>
            </div>

            <h1 id="debugMessage" class="paused">Press Space</h1>
            <id id="canvasBorder">
                <canvas id="pongCanvas" width="800" height="400"></canvas>
            </id>
        </div>

        <!-- Footer -->
        <footer class="py-3">
            <div class="container">
                <p class="m-0">Copyright &copy; Pong 2023</p>
            </div>
        </footer>
    
    </body>

    <script src="script/pong.js"></script>
    <script src="app.js"></script>

</html>
