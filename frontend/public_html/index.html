<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <!-- Title -->
        <title>PONG | · |</title>
        
        <!-- Favicon-->
        <link rel="icon" type="image/x-icon" href="images/favicon.ico">

        <!-- Bootstrap -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/3.6.0/css/flag-icon.min.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

        <!-- CSS Styles -->
        <link rel="stylesheet" href="style/index.css">
        <link rel="stylesheet" href="style/pong.css">
        <link rel="stylesheet" href="style/settings.css">
        <link rel="stylesheet" href="style/login.css">
        <link rel="stylesheet" href="style/register.css">
        <link rel="stylesheet" href="style/info.css">
        <link rel="stylesheet" href="style/game.css">
    </head>
    
    <body>

        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg shadow-sm">
            <div class="container-fluid">

                <!-- Navbar brand -->
                <a class="navbar-brand" data-key="navbarBrand">PONG</a>
                
                <!-- Navbar toggler -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                
                <!-- Navbar links -->
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link" onclick="loadPage('tournament')" data-key="tournament">Tournament</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" onclick="loadPage('info')" data-key="info">Info</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" onclick="loadSettings('settings')" data-key="settings">Settings</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" onclick="loadPage('game')" data-key="game">Game</a>
                        </li>
                    </ul>                    
                    <div class="button-container" id="auth-container">
                        <button class="btn login-button" onclick="loadPage('login')" data-key="login">Log in</button>
                        <button class="btn signup-button" onclick="loadPage('register')" data-key="signup">Sign up</button>
                    </div>                    
                </div>
            </div>
        </nav>    

        <!-- Dynamic content -->
        <div class="content-container" id="content-container">
        </div>
        
        <!-- Game -->
        <div id="game">
            <div id="score">
                <h1 id="player1Score">0</h1>
                <h1 id="player2Score">0</h1>
            </div>

            <h1 id="debugMessage" class="paused"></h1>
            <id id="canvasBorder" class="canvas-border">
                <canvas id="pongCanvas" width="800" height="400"></canvas>
            </id>
        </div>

        <!-- Footer -->
        <footer class="py-3">
            <div class="container">
                <p class="m-0">Copyright &copy; Pong 2025</p>
            </div>
        </footer>
    
    </body>

    <script src="script/pong.js"></script>
    <script src="app.js"></script>
    <script src="script/settings.js"></script>
    <script src="script/login.js"></script>
    <script src="script/onLoad.js"></script>
</html>
