<div class="settings">
    <!-- Sound/ Dark Mode -->
    <div class="settings-header">
        <h2 class="settings-header-title">Game Customization</h2>
        <div class="settings-header-icons">
            <i class="fas fa-bell settings-header-icons-elem" id="soundIcon" onclick="toggleSound()"></i>
            <i class="fas fa-sun settings-header-icons-elem" id="modeIcon" onclick="toggleMode()"></i>
        </div>
    </div>


    <!-- Opciones del Juego -->
    <div class="settings-options">
        <!-- BALL SIZE -->
        <div class="size-picker mb-4">
            <h5>Ball Size</h5>
            <input type="range" class="form-range" id="sizeRange" min="30" max="90" step="30" value="60" oninput="updateBallSize(this)">
            <div class="size-labels">
                <span>Small</span>
                <span>Medium</span>
                <span>Large</span>
            </div>
        </div>

        <!-- BALL SPEED -->
        <div class="ball-speed mb-4">
            <h5>Ball Speed</h5>
            <input type="range" class="form-range" id="ballSpeed" min="1" max="5" value="3">
            <div class="speed-labels">
                <span>1</span>
                <span>2</span>
                <span>3</span>
                <span>4</span>
                <span>5</span>
            </div>
        </div>

        <!-- BALL COLOR -->
        <div class="color-picker mb-4">
            <h5>Choose Ball Color</h5>
            <div class="color-options">
                <button class="color-option" style="background-color: red;"></button>
                <button class="color-option" style="background-color: green;"></button>
                <button class="color-option" style="background-color: blue;"></button>
                <button class="color-option" style="background-color: yellow;"></button>
                <button class="color-option" style="background-color: purple;"></button>
            </div>
        </div>

        <!-- BACKGROUND -->
        <div class="background-picker mb-4">
            <h5>Choose a background for the game</h5>
            <div class="background-options">
                <button class="background-option" onclick="changeBackground('bg1', this)">
                    <img src="{% static 'images/background.png' %}" alt="Background 1" class="background-thumbnail">
                </button>
                <button class="background-option" onclick="changeBackground('bg2', this)">
                    <img src="{% static 'images/background.png' %}" alt="Background 2" class="background-thumbnail">
                </button>
                <button class="background-option" onclick="changeBackground('bg3', this)">
                    <img src="{% static 'images/background.png' %}" alt="Background 3" class="background-thumbnail">
                </button>
                <button class="background-option" onclick="changeBackground('bg4', this)">
                    <img src="{% static 'images/background.png' %}" alt="Background 4" class="background-thumbnail">
                </button>
            </div>
        </div>
    </div>
    <!-- Edit Profile Section -->
<div id="editProfileSection" class="settings-profile-editor mb-4">
    <h2 class="settings-header-title">Edit profile</h2>
    <div class="mb-3 settings-profile-editor-item">
        <label for="editUsername" class="form-label">Username</label>
        <input type="text" class="form-control" id="editUsername" placeholder="Enter new username">
    </div>
    <div class="mb-3 settings-profile-editor-item">
        <label for="editEmail" class="form-label">Email</label>
        <input type="email" class="form-control" id="editEmail" placeholder="Enter new email">
    </div>
    <div class="mb-3 settings-profile-editor-item">
        <label for="editPassword" class="form-label">Password</label>
        <input type="password" class="form-control" id="editPassword" placeholder="Enter new password">
    </div>
    <button type="button" class="btn btn-primary" onclick="saveProfileChanges()">Save Changes</button>
</div>
</div>
