

<div id="playerInfoScreen" style="display:none;">
    <h2>Player 1 Setup</h2>
    <label for="player1Name">Enter Player 1 Name:</label>
    <input type="text" id="player1Name" />
    
    <label for="player1Attack">Choose Attack:</label>
    <select id="player1Attack">
        <option value="normal">Normal</option>
        <option value="power">Power Attack</option>
    </select>
    
    <label for="player1Color">Choose Color:</label>
    <input type="color" id="player1Color" value="#357ABD" />
    
    <button id="player1ReadyButton">Ready</button>
</div>

<div id="countdownScreen" style="display:none;">
    <h2>Get Ready!</h2>
    <div id="countdown">3</div>
</div>

<canvas id="pongCanvas" width="800" height="600"></canvas>
