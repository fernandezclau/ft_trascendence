<div class="register-container">
    <div class="register-box">
        <h2 class="text-center" data-key="create_account">Create an Account</h2>
        <p class="text-center text-muted" data-key="signup_message">Sign up to start playing</p>

        <form id="registerForm">
            <div class="mb-3 register-elem">
                <label for="newUsername" class="form-label" data-key="username_label">Username</label>
                <input type="text" class="register-form-control" id="newUsername" name="newUsername" placeholder="Enter your username" required data-key="username_placeholder">
            </div>

            <div class="mb-3 register-elem">
                <label for="email" class="form-label" data-key="email_label">Email</label>
                <input type="email" class="register-form-control" id="email" name="email" placeholder="Enter your email" required data-key="email_placeholder">
            </div>

            <div class="mb-3 password-input-wrapper register-elem">
                <label for="newPassword" class="form-label" data-key="password_label">Password</label>
                <div class="input-container">
                    <input type="password" class="register-form-control" id="newPassword" name="newPassword" placeholder="Create a password" required data-key="password_placeholder">
                    <i class="fas fa-eye" id="toggleNewPassword" onclick="togglePassword('newPassword', 'toggleNewPassword')"></i>
                </div>
            </div>

            <div class="mb-3 password-input-wrapper register-elem">
                <label for="confirmPassword" class="form-label" data-key="confirm_password_label">Confirm Password</label>
                <div class="input-container">
                    <input type="password" class="register-form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required data-key="confirm_password_placeholder">
                    <i class="fas fa-eye" id="toggleConfirmPassword" onclick="togglePassword('confirmPassword', 'toggleConfirmPassword')"></i>
                </div>
            </div>

            <button type="submit" class="btn btn-dark w-100" data-key="signup_button">Sign Up</button>
        </form>

        <div class="mt-1">
            <button class="btn btn-light w-100 btn-hover">
                <img src="images/42_icon.png" alt="Google Logo" width="20">
                <span data-key="signup_42">Sign up with 42</span>
            </button>
        </div>

        <div class="mt-3 text-center">
            <p><span data-key="already_have_account" class="register-already-account text-muted">Already have an account?</span> 
                <a href="#" class="sign-up" onclick="loadPage('login')" data-key="login_link">Log in</a></p>
        </div> 
    </div>
    <script>
        document.getElementById("registerForm").addEventListener("submit", function(event) {
            event.preventDefault();
        
            const username = document.getElementById("newUsername").value;
            const email = document.getElementById("email").value;
            const password = document.getElementById("newPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
        
            if (password !== confirmPassword) {
                alert("Las contraseñas no coinciden.");
                return;
            }
            const data = { username, email, password };
        
            fetch("http://localhost:8001/api/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.message) {
                    alert("Registro exitoso. Ahora puedes iniciar sesión.");
                    loadPage("login");
                } else {
                    alert("Error: " + data.error);
                }
            })
            .catch(error => console.error("Error:", error));
        });
        </script>
</div>
