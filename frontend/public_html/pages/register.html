
<div class="register-container">
    <div class="register-box">
        <h2 class="text-center">Create an Account</h2>
        <p class="text-center text-muted">Sign up to start playing</p>
 
        <form id="registerForm">
            <div class="mb-3 register-elem">
                <label for="newUsername" class="form-label">Username</label>
                <input type="text" class="form-control" id="newUsername" name="newUsername" placeholder="Enter your username" required>
             </div>
 
            <div class="mb-3 register-elem">
                <label for="email" class="form-label">Email</label>
                 <input type="email" class="form-control" id="email" name="email" placeholder="Enter your email" required>
            </div>
 
            <div class="mb-3 password-input-wrapper register-elem">
                <label for="newPassword" class="form-label">Password</label>
                <div class="input-container">
                    <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="Create a password" required>
                    <i class="fas fa-eye" id="toggleNewPassword" onclick="togglePassword('newPassword', 'toggleNewPassword')"></i>
                </div>
            </div>
 
            <div class="mb-3 password-input-wrapper register-elem">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <div class="input-container">
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                    <i class="fas fa-eye" id="toggleConfirmPassword" onclick="togglePassword('confirmPassword', 'toggleConfirmPassword')"></i>
                </div>
            </div>
 
            <button type="submit" class="btn btn-dark w-100">Sign Up</button>
        </form>
 
        <div class="mt-1">
            <button class="btn btn-light w-100 btn-hover">
                <img src="images/42_icon.png" alt="Google Logo" width="20">
                Sign up with 42
            </button>
        </div>
 
        <div class="mt-3 text-center">
            <p>Already have an account? <a href="#" class="sign-up" onclick="loadPage('login')">Log in</a></p>
        </div> 
    </div>
 </div>
