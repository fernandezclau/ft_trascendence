<div class="otp-setup-container">
    <div class="otp-setup-box">
        <h2 class="text-center" data-key="setup_2fa">Configura la Autenticación de Dos Factores</h2>
        <p class="text-center text-muted" data-key="setup_2fa_message">Escanea el código QR con Google Authenticator para completar tu registro</p>

        <div class="qr-container">
            <img id="qrCode" src="" alt="Código QR para Google Authenticator">
        </div>

        <div class="mb-3 otp-input">
            <label for="otpCode" class="form-label" data-key="otp_code_label">Código de verificación</label>
            <input type="text" class="register-form-control" id="otpCode" placeholder="Ingresa el código de 6 dígitos" required data-key="otp_code_placeholder" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}">
        </div>

        <button type="button" class="btn btn-dark w-100" onclick="verifyOTP()" data-key="verify_button">Verificar</button>

        <div class="mt-3">
            <p class="text-center text-muted" data-key="otp_instructions">
                1. Descarga la aplicación Google Authenticator<br>
                2. Escanea el código QR<br>
                3. Ingresa el código de 6 dígitos que aparece en la aplicación
            </p>
        </div>
    </div>
</div>
