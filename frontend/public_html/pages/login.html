<div class="login-container">
    <div class="login-box">
        <h2 class="text-center" data-key="welcome_back">Welcome back</h2>
        <p class="text-center text-muted" data-key="welcome_message">Welcome back! Please enter your details.</p>

        <form id="loginForm">
            <div class="mb-3 login-elem">
                <label for="email" class="form-label" data-key="email_label">Email</label>
                <input type="email" class="register-form-control" id="email" placeholder="Enter your email" required data-key="email_placeholder">
            </div>
            <div class="mb-2 login-elem input">
                <label for="password" class="form-label" data-key="password_label">Password</label>
                <div class="input-container">
                    <input type="password" class="register-form-control" id="password" placeholder="Password" required data-key="password_placeholder">
                    <i class="fas fa-eye" id="togglePassword" onclick="togglePassword('password', 'togglePassword')"></i>
                </div>
            </div>

            <button type="submit" class="btn btn-dark w-100" data-key="login_button">Login</button>

            <button type="button" onclick="window.location.href='http://localhost:8000/api/auth/42/login'" 
                class="btn w-100 mt-3 btn-hover login-button">
                <img src="images/42_icon.png" alt="42 Logo" width="25">
                <span data-key="sign_in_42">Sign in with 42</span>
            </button>
        </form>

        <p class="text-center mt-3">
            <span data-key="no_account">Don't have an account?</span> 
            <a href="#" class="sign-up" onclick="loadPage('register')" data-key="sign_up">Sign up</a>
        </p>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
        
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
        
            const data = { email, password };
        
            fetch("http://localhost:8001/api/auth/login", {  // Backend 2 para login normal
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.token) {
                    localStorage.setItem("jwt", data.token);
                    localStorage.setItem("auth_method", "normal");
                    localStorage.setItem("image_url", data.image_url || "https://i.imgur.com/DP2aShH.png");
                    window.location.href = "/";
                } else {
                    alert("Error: " + data.error);
                }
            })
            .catch(error => console.error("Error:", error));
        });
        </script>
        
    <script src="script/onLoad.js"></script>
</div>
